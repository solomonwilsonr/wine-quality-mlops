$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

# -----------------------------------------------------------------------
# Azure ML Managed Online Deployment — Blue slot
# Endpoint: wine-quality-prod  (azure/endpoint.yml)
# -----------------------------------------------------------------------
name: blue
endpoint_name: wine-quality-prod
description: >
  Blue deployment slot for the Wine Quality Classifier.
  Receives 100% of traffic by default; swap to green for zero-downtime releases.

model: azureml:wine-quality-classifier@latest
environment: azureml:wine-quality-env@latest

code_configuration:
  code: ..
  scoring_script: src/score.py

instance_type: Standard_DS2_v2
instance_count: 1

liveness_probe:
  initial_delay: 30
  period: 10
  timeout: 5
  failure_threshold: 3
  success_threshold: 1

readiness_probe:
  initial_delay: 10
  period: 10
  timeout: 5
  failure_threshold: 3
  success_threshold: 1

environment_variables:
  APPLICATIONINSIGHTS_CONNECTION_STRING: ""
  MODEL_VERSION: "latest"
  LOG_LEVEL: "INFO"
  MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "true"

request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 10
  max_queue_wait_ms: 60000

scale_settings:
  type: default

tags:
  project: wine-quality-classifier
  slot: blue
  managed_by: github-actions
