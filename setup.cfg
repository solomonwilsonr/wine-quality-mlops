# =======================================================================
# setup.cfg — flake8 configuration (pyproject.toml does not support flake8)
# =======================================================================

[flake8]
max-line-length = 100
# E203 — whitespace before ':' (conflicts with black slice formatting)
# W503 — line break before binary operator (conflicts with black)
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist,
    *.egg-info
per-file-ignores =
    # Allow star imports and unused imports in __init__ files
    __init__.py: F401, F403
    # Tests may use assert and broad exceptions
    tests/*.py: S101, BLE001
