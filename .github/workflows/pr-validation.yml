# PR Validation Workflow
# Lightweight checks on every pull request — lint, unit tests, security scan.
# Does NOT deploy to Azure — keeps PR feedback fast and free.

name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.9"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: flake8
        run: flake8 src/ tests/ --max-line-length=120 --statistics

      - name: black
        run: black --check --diff src/ tests/

      - name: isort
        run: isort --check-only --diff src/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/ \
            -k "not integration" \
            --cov=src \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-fail-under=50 \
            -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: bandit -r src/ -ll -ii

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, security-scan]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Post PR comment with results
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint: '${{ needs.lint.result }}',
              tests: '${{ needs.unit-tests.result }}',
              security: '${{ needs.security-scan.result }}'
            };
            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const body = [
              '## PR Validation Results',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Lint (flake8 / black / isort) | ${icon(results.lint)} ${results.lint} |`,
              `| Unit Tests (Python 3.9/3.10/3.11) | ${icon(results.tests)} ${results.tests} |`,
              `| Security Scan (bandit) | ${icon(results.security)} ${results.security} |`,
              '',
              '_Note: Azure ML training and deployment only run on merge to main._'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
